[project]
name = "tiny-llm"
version = "0.1.0"
description = "A tiny LLM implementation for educational purposes"
requires-python = ">=3.8"

dependencies = [
    "torch>=1.12.0",
    "numpy>=1.21.0",
    "tqdm>=4.64.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "black>=22.0.0",
]

[project.scripts]
tiny-llm = "tiny_llm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow tests",
    "integration: integration tests", 
    "contract: contract tests",
]
